# Robot de révision d'une relecture close (perlimpinpin.ai/relectures).
# Déclenché par le bouton « Envoyer en révision » (mode comité), via
# POST /api/relectures/revision, ou à la main : Actions → Révision d'une
# relecture → Run workflow, avec le slug de la fiche.
#
# 1. scripts/reviser-relecture.js : étapes 2, 3 et 3 bis sur la fiche relue,
#    avec les commentaires du Club (fiche finale en brouillon sur /test), puis
#    sorties dans data/analyses finales/, bloc archive et page /relectures.
# 2. Branche revision/<slug>, commit, push et pull request « Révision <slug> »
#    vers main, NON fusionnée : Arno relit /test et la PR, puis fusionne
#    (workflow « Après révision » : PerlimpinPOINTS) et clique sur Publier.
#
# Aucun nom ni e-mail d'adhérent dans les journaux : seulement des comptes.
# Secrets (Settings → Secrets and variables → Actions) : DATABASE_URL,
# ANTHROPIC_API_KEY, MISTRAL_API_KEY, GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL.

name: Révision d'une relecture
# Titre du run : sert à l'API pour repérer une révision déjà en cours.
run-name: Révision ${{ inputs.slug }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug de la fiche (nom du fichier de data/relectures/, sans .json)"
        required: true
        type: string

concurrency:
  group: revision-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: ${{ inputs.slug }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BRANCHE: revision/${{ inputs.slug }}
    steps:
      - name: Récupération de main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le postinstall lance « prisma generate » (client utilisé par les scripts).
      - name: Installation des modules
        run: npm ci

      # Avant tout appel payant.
      - name: Vérifications
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AUTEUR_NOM: ${{ secrets.GIT_AUTHOR_NAME }}
          AUTEUR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          if ! echo "$SLUG" | grep -Eq '^[a-z0-9-]{1,120}$'; then echo "✗ Slug invalide."; exit 1; fi
          if [ ! -f "data/relectures/$SLUG.json" ]; then echo "✗ data/relectures/$SLUG.json introuvable."; exit 1; fi
          for s in DATABASE_URL ANTHROPIC_API_KEY AUTEUR_NOM AUTEUR_EMAIL; do
            if [ -z "${!s}" ]; then echo "✗ Secret manquant ($s, voir l'en-tête du workflow)."; exit 1; fi
          done
          if [ -z "$MISTRAL_API_KEY" ]; then echo "⚠ MISTRAL_API_KEY absent : étape 2 sautée (mode dégradé)."; fi
          if git ls-remote --exit-code --heads origin "$BRANCHE" > /dev/null; then
            echo "✗ La branche $BRANCHE existe déjà : une révision de cette fiche attend dans une PR. Ferme-la et supprime la branche pour relancer."
            exit 1
          fi

      - name: Révision (étapes 2, 3 et 3 bis avec les commentaires du Club)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: node scripts/reviser-relecture.js "$SLUG" --sortie "$RUNNER_TEMP/revision"

      - name: Contrôle des fichiers modifiés
        run: |
          attendus="$RUNNER_TEMP/revision/fichiers.txt"
          git -c core.quotepath=false status --porcelain --untracked-files=all | sed 's/^...//; s/^"\(.*\)"$/\1/' > "$RUNNER_TEMP/modifies.txt"
          inattendus=$(grep -vxF -f "$attendus" "$RUNNER_TEMP/modifies.txt" || true)
          if [ -n "$inattendus" ]; then
            echo "✗ Fichiers inattendus modifiés :"; echo "$inattendus"; exit 1
          fi
          cat "$RUNNER_TEMP/modifies.txt"

      - name: Branche, commit et pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          AUTEUR_NOM: ${{ secrets.GIT_AUTHOR_NAME }}
          AUTEUR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "$AUTEUR_NOM"
          git config user.email "$AUTEUR_EMAIL"
          git switch -c "$BRANCHE"
          while IFS= read -r f; do [ -n "$f" ] && git add -- "$f"; done < "$RUNNER_TEMP/revision/fichiers.txt"
          git commit -q -m "Révision $SLUG : réponses aux commentaires et fiche finale"
          git push -q origin "$BRANCHE"
          lien=$(gh pr create --base main --head "$BRANCHE" --title "Révision $SLUG" --body-file "$RUNNER_TEMP/revision/rapport.md")
          echo "lien=$lien" >> "$GITHUB_OUTPUT"
          echo "Pull request : $lien"

      # Rapport sans aucun nom d'adhérent (scripts/lib/revision-relecture.js).
      - name: Résumé
        if: ${{ always() }}
        env:
          LIEN_PR: ${{ steps.pr.outputs.lien }}
        run: |
          rapport="$RUNNER_TEMP/revision/rapport.md"
          if [ ! -f "$rapport" ]; then exit 0; fi
          {
            if [ -n "$LIEN_PR" ]; then echo "**Pull request : $LIEN_PR**"; else echo "**⚠ Pull request non créée : voir le journal.**"; fi
            echo
            cat "$rapport"
          } >> "$GITHUB_STEP_SUMMARY"

      # logs/ n'est pas conservé sur le serveur GitHub : le journal des
      # insertions (analyse créée en brouillon) est gardé ici 90 jours.
      - name: Journal des insertions
        if: ${{ always() && hashFiles('logs/*.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: journal-revision-${{ inputs.slug }}-${{ github.run_id }}
          path: logs/*.jsonl
          retention-days: 90
